name: Tarik — compatibilité firmware caméras / Genetec

# Synchronise chaque lundi la Supported Device List Genetec dans
# tarik/data/genetec-sdl.json (commit seulement si changement).
# En lancement manuel, peut aussi vérifier un firmware précis : le verdict
# s'affiche dans le résumé du job (onglet Actions).

on:
  push:
    paths:
      - "tarik/parc.txt"
      - "tarik/src/**"
  schedule:
    - cron: "17 4 * * 1" # lundi 04:17 UTC
  workflow_dispatch:
    inputs:
      firmware:
        description: "Nom du fichier firmware (ex. PNM-9322VQP_2.24.01_20260827_R3.zip) — optionnel"
        required: false
      sc:
        description: "Version Security Center (ex. 5.11)"
        required: false
      details:
        description: "Enrichir avec les fiches détail (plus long)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tarik-sync
  cancel-in-progress: false

jobs:
  tarik:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Tests
        working-directory: tarik
        run: node test/smoke.test.js

      - name: Synchroniser la Supported Device List
        working-directory: tarik
        run: node src/index.js sync ${{ inputs.details && '--details' || '' }}

      - name: Vérifier le firmware demandé
        if: ${{ inputs.firmware != '' && inputs.firmware != null }}
        working-directory: tarik
        env:
          FW: ${{ inputs.firmware }}
          SC: ${{ inputs.sc }}
        run: |
          set +e
          node src/index.js check "$FW" ${SC:+--sc "$SC"} | tee result.txt
          { echo '```'; cat result.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Vérifier le parc (tarik/parc.txt)
        working-directory: tarik
        run: |
          set +e
          [ -f parc.txt ] || exit 0
          echo '## Vérification du parc' >> "$GITHUB_STEP_SUMMARY"
          grep -vE '^\s*(#|$)' parc.txt | while read -r fw sc; do
            node src/index.js check "$fw" ${sc:+--sc "$sc"} | tee -a parc-result.txt
            echo >> parc-result.txt
          done
          { echo '```'; cat parc-result.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Diagnostic si la synchro échoue
        if: failure()
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36'
          curl -sSL -A "$UA" 'https://www.genetec.com/supported-device-list?page=1' -o page1.html || true
          curl -sSL -A "$UA" 'https://www.genetec.com/solutions/resources/supported-device-list/detail?pid=2528' -o detail.html || true
          for f in page1.html detail.html; do
            echo "===== $f ($(wc -c < $f) octets) ====="
            sed -e 's/></>\n</g' "$f" | grep -vE '^\s*$' | cut -c1-300
          done

      - name: Committer si changement
        run: |
          set -euo pipefail
          FILE="tarik/data/genetec-sdl.json"
          git add -N "$FILE"
          if git diff --quiet -- "$FILE"; then
            echo "Aucun changement — rien à committer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore(tarik): mise à jour de la Supported Device List Genetec"
          git push origin "HEAD:${GITHUB_REF_NAME}"
